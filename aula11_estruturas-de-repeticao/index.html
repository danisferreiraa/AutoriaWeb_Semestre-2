<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estruturas de Repetição</title>
</head>
<body>
    <script>

        for(let i = 0 ; i < 10 ; i++){
            console.log("FOR com incremento: "+ i);
        }
        for(let j = 10 ; j > 0 ; j--){
            console.log("FOR com decremento: "+ j);
        }
        const frutas = ['banana', 'laranja', 'morango'];
        frutas.forEach(fruta => {
            console.log(fruta);
        })
        // "fruta" é usada para controle do forEach, representa cada item
        for (let w = 0 ; w < frutas.length ; w++){
            console.log("FOR com lista: "+frutas[w]);
        }

    let d = 0;
    while( d<10 ){
        console.log("WHILE: "+d);
        d+=2;
    }
    </script>
    <div id="resultado" style="font-size: 5rem;"></div>
    <script>
        let resultado = document.getElementById("resultado")
        for(let r = 0; r < 5; r++){
            resultado.innerHTML+=
            `<p style='font-size: ${r}rem'>INFOWEB-</p>`
            //"<p style=font-size:"+ r +"rem>INFOWEB-</p>   "
            // é necessário colocar '+=' porque eu quero
            // que mostre várias vezes

            // a marcação de span não tem valor semântico
            //e é inline
        }
    </script>
    </script>
</body>
</html>
